# Render blueprint for the backend. Secrets are marked sync:false and are
# entered in the Render dashboard, never committed.
services:
  - type: web
    name: repodefend-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false          # Neon connection string
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: FRONTEND_URL
        sync: false          # e.g. https://repodefend.vercel.app
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_TOKEN
        sync: false          # optional: 5,000 GitHub API requests/hour instead of 60
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: groq
